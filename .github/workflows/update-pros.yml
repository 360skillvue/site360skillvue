name: Update professionals.json

on:
  schedule:
    - cron: '0 3 * * *'   # every day at 3am UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch & geocode professionals
        run: node scripts/fetch-pros.mjs

      - name: Commit updated JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/professionals.json
          git diff --cached --quiet || git commit -m "chore: update professionals.json [skip ci]"
          git push
